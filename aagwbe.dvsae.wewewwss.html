                const route = useRoute();
                const router = useRouter();
                const type = route.query.type;
                const title = route.query.title;
                const count = parseInt(route.query.count) || 10;

                function goBack() {
                    router.go(-1);
                }

                function viewDetail(stock) {
                    router.push({ path: '/detail', query: { code: stock.code } });
                }

                const displayedStocks = computed(() => {
                    let list = [...stockList];
                    if (type === 'gainers') {
                        list.sort((a, b) => b.change - a.change);
                    } else if (type === 'losers') {
                        list.sort((a, b) => a.change - b.change);
                    } else if (type === 'avoid') {
                        list.sort((a, b) => a.change - b.change);
                    } else {
                        // random slice for others
                        list.sort(() => Math.random() - 0.5);
                    }
                    return list.slice(0, count);
                });

                return { title, type, displayedStocks, goBack, viewDetail };
            }
        };

        // Stock Detail Component with SVG Chart
        const DetailComponent = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="goBack">
                            <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            Back
                        </button>
                        <h2>{{ stock.code }}</h2>
                        <div style="width:40px;"></div>
                    </div>

                    <div style="padding:20px;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;">
                            <div>
                                <div style="font-size:14px; color:var(--text-secondary);">{{ stock.name }}</div>
                                <div style="font-size:28px; font-weight:700; margin-top:4px;">$\\\$ {{ stock.price.toFixed(2) }}</div>
                            </div>
                            <div :style="{ color: stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '16px', fontWeight: 600 }">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change }}%
                            </div>
                        </div>

                        <!-- Native SVG Price Chart -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); margin-bottom:20px;">
                            <div style="font-size:13px; color:var(--text-secondary); margin-bottom:12px;">1-Month Price Trend</div>
                            <svg viewBox="0 0 300 120" style="width:100%; height:auto; overflow:visible;">
                                <!-- Dynamic Grid Lines -->
                                <line x1="0" y1="0" x2="300" y2="0" stroke="var(--border-color)" stroke-dasharray="4"/>
                                <line x1="0" y1="60" x2="300" y2="60" stroke="var(--border-color)" stroke-dasharray="4"/>
                                <line x1="0" y1="120" x2="300" y2="120" stroke="var(--border-color)" stroke-dasharray="4"/>
                                
                                <!-- Polyline -->
                                <polyline :points="svgPoints" fill="none" :stroke="stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:8px;">
                                <span>Min: $\\\$ {{ minPrice }}</span>
                                <span>Max: $\\\$ {{ maxPrice }}</span>
                            </div>
                        </div>

                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius);">
                            <h4 style="font-size:14px; font-weight:600; margin-bottom:8px;">Key Statistics</h4>
                            <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border-color);">
                                <span style="color:var(--text-secondary);">Previous Close</span>
                                <span style="font-weight:600;">$\\\$ {{ (stock.price * (1 - stock.change/100)).toFixed(2) }}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0;">
                                <span style="color:var(--text-secondary);">Volume</span>
                                <span style="font-weight:600;">1.28M</span>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const code = route.query.code;
                const stock = stockList.find(s => s.code === code) || stockList[0];

                function goBack() {
                    router.go(-1);
                }

                const minPrice = computed(() => Math.min(...stock.history).toFixed(2));
                const maxPrice = computed(() => Math.max(...stock.history).toFixed(2));

                const svgPoints = computed(() => {
                    const data = stock.history;
                    const min = Math.min(...data);
                    const max = Math.max(...data);
                    const range = max - min || 1;
                    const width = 300;
                    const height = 120;
                    
                    return data.map((val, idx) => {
                        const x = (idx / (data.length - 1)) * width;
                        const y = height - ((val - min) / range) * (height - 20) - 10;
                        return `${x},${y}`;
                    }).join(' ');
                });

                return { stock, goBack, minPrice, maxPrice, svgPoints };
            }
        };

        // 3. Toolbox Component
        const ToolboxComponent = {
            template: `
                <div style="padding:16px;">
                    <h2 style="font-size:20px; font-weight:700; margin-bottom:16px;">Financial Toolbox</h2>
                    
                    <div style="display:flex; flex-direction:column; gap:16px;">
                        <!-- 3.2 DCA Profit Calculator -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
                            <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">DCA Profit-Taking</h3>
                            <div class="input-group">
                                <label>Cost Price</label>
                                <input type="number" v-model.number="dca.cost" />
                            </div>
                            <div class="input-group">
                                <label>Target Take-Profit Price</label>
                                <input type="number" v-model.number="dca.target" />
                            </div>
                            <div class="input-group">
                                <label>Shares</label>
                                <input type="number" v-model.number="dca.shares" />
                            </div>
                            <div style="font-size:14px; font-weight:600; color:var(--primary-color);">
                                Estimated Return: $\\\$ {{ dcaResult }}
                            </div>
                        </div>

                        <!-- 3.4 Loan Calculator -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
                            <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">Loan Calculator</h3>
                            <div class="input-group">
                                <label>Principal Amount</label>
                                <input type="number" v-model.number="loan.amount" />
                            </div>
                            <div class="input-group">
                                <label>Annual Interest Rate (%)</label>
                                <input type="number" v-model.number="loan.rate" />
                            </div>
                            <div class="input-group">
                                <label>Term (Months)</label>
                                <input type="number" v-model.number="loan.months" />
                            </div>
                            <div style="font-size:14px; font-weight:600; color:var(--primary-color);">
                                Monthly Payment: $\\\$ {{ loanResult }}
                            </div>
                        </div>

                        <!-- 3.5 Profit Calculator -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
                            <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">Profit Calculator</h3>
                            <div class="input-group">
                                <label>Unit Cost</label>
                                <input type="number" v-model.number="profit.cost" />
                            </div>
                            <div class="input-group">
                                <label>Unit Selling Price</label>
                                <input type="number" v-model.number="profit.price" />
                            </div>
                            <div class="input-group">
                                <label>Volume Sold</label>
                                <input type="number" v-model.number="profit.volume" />
                            </div>
                            <div style="font-size:14px; font-weight:600; color:var(--success-color);">
                                Net Profit: $\\\$ {{ profitResult }}
                            </div>
                        </div>

                        <!-- 3.6 Reverse Yield Calculator -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
                            <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">Reverse Yield Calculator</h3>
                            <div class="input-group">
                                <label>Target Total Return</label>
                                <input type="number" v-model.number="rev.target" />
                            </div>
                            <div class="input-group">
                                <label>Initial Principal</label>
                                <input type="number" v-model.number="rev.principal" />
                            </div>
                            <div class="input-group">
                                <label>Duration (Years)</label>
                                <input type="number" v-model.number="rev.years" />
                            </div>
                            <div style="font-size:14px; font-weight:600; color:var(--primary-color);">
                                Required Annualized Return: {{ revResult }}%
                            </div>
                        </div>

                        <!-- 3.7 Password Strength & MD5 -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
                            <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">Password Strength & MD5</h3>
                            <div class="input-group">
                                <label>Enter Passphrase</label>
                                <input type="password" v-model="pwd.input" @input="checkPwd" />
                            </div>
                            <div style="font-size:13px; font-weight:600; margin-bottom:6px;" :style="{ color: pwd.color }">
                                Strength: {{ pwd.strength }}
                            </div>
                            <div style="font-size:12px; color:var(--text-secondary); word-break:break-all;">
                                MD5 Hash: {{ pwd.hash }}
                            </div>
                        </div>

                        <!-- 3.8 Credit Memo -->
                        <div style="background:var(--bg-color); padding:16px; border-radius:var(--radius); border:1px solid var(--border-color);">
                            <h3 style="font-size:15px; font-weight:600; margin-bottom:12px;">Credit Memo Tracker</h3>
                            <div class="input-group">
                                <label>Debtor Name</label>
                                <input type="text" v-model="credit.name" placeholder="Client Name" />
                            </div>
                            <div class="input-group">
                                <label>Amount</label>
                                <input type="number" v-model.number="credit.amount" />
                            </div>
                            <button class="btn" @click="saveCredit" style="margin-top:8px;">Add Memo</button>
                            <div v-if="credit.saved" style="margin-top:12px; font-size:13px; color:var(--success-color);">
                                Memo saved locally for {{ credit.name }} ($\\\$ {{ credit.amount }})
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                // 3.2 DCA
                const dca = reactive({ cost: 100, target: 130, shares: 50 });
                const dcaResult = computed(() => ((dca.target - dca.cost) * dca.shares).toFixed(2));

                // 3.4 Loan
                const loan = reactive({ amount: 100000, rate: 5.5, months: 36 });
                const loanResult = computed(() => {
                    let r = loan.rate / 100 / 12;
                    let n = loan.months;
                    let p = loan.amount;
                    if (r === 0) return (p / n).toFixed(2);
                    let payment = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                    return payment.toFixed(2);
                });

                // 3.5 Profit
                const profit = reactive({ cost: 40, price: 65, volume: 150 });
                const profitResult = computed(() => ((profit.price - profit.cost) * profit.volume).toFixed(2));

                // 3.6 Reverse Yield
                const rev = reactive({ target: 15000, principal: 10000, years: 3 });
                const revResult = computed(() => {
                    if (rev.principal <= 0 || rev.years <= 0) return 0;
                    let rate = (Math.pow(rev.target / rev.principal, 1 / rev.years) - 1) * 100;
                    return rate.toFixed(2);
                });

                // 3.7 Password Strength & MD5
                const pwd = reactive({ input: '', strength: 'None', color: 'var(--text-secondary)', hash: '-' });
                function checkPwd() {
                    if (!pwd.input) {
                        pwd.strength = 'None';
                        pwd.color = 'var(--text-secondary)';
                        pwd.hash = '-';
                        return;
                    }
                    pwd.hash = md5(pwd.input);
                    if (pwd.input.length > 8 && /[A-Z]/.test(pwd.input) && /[0-9]/.test(pwd.input)) {
                        pwd.strength = 'Strong';
                        pwd.color = 'var(--success-color)';
                    } else if (pwd.input.length >= 6) {
                        pwd.strength = 'Moderate';
                        pwd.color = '#d97706';
                    } else {
                        pwd.strength = 'Weak';
                        pwd.color = 'var(--danger-color)';
                    }
                }

                // 3.8 Credit Memo
                const credit = reactive({ name: '', amount: 0, saved: false });
                function saveCredit() {
                    if (!credit.name || !credit.amount) return;
                    credit.saved = true;
                    showToast('Credit memo saved');
                }

                return { dca, dcaResult, loan, loanResult, profit, profitResult, rev, revResult, pwd, checkPwd, credit, saveCredit };
            }
        };

        // 4. Settings Component
        const SettingsComponent = {
            template: `
                <div style="padding:16px;">
                    <h2 style="font-size:20px; font-weight:700; margin-bottom:16px;">Settings</h2>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <div @click="goTo('/version')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>Version Information</span>
                            <span style="color:var(--text-secondary); font-size:13px;">v2.4.0</span>
                        </div>
                        <div @click="goTo('/privacy')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>Privacy Policy</span>
                            <span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="goTo('/terms')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>Terms of Service</span>
                            <span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="goTo('/team')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>About Team</span>
                            <span style="color:var(--text-secondary);">›</span>
                        </div>
                        <a href="mailto:aagwbe.dvsae.weweww@gmail.com" style="text-decoration:none; color:inherit;">
                            <div style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                                <span>Contact Us</span>
                                <span style="color:var(--text-secondary);">›</span>
                            </div>
                        </a>
                        <div @click="goTo('/checkin')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>Monthly Check-in</span>
                            <span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="goTo('/feedback')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>Customer Feedback</span>
                            <span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="goTo('/inbox')" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
                            <span>Inbox</span>
                            <span style="color:var(--text-secondary);">›</span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                function goTo(path) {
                    router.push(path);
                }
                return { goTo };
            }
        };

        // Subpages for Settings
        const StaticContentComponent = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="goBack">
                            <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            Back
                        </button>
                        <h2>{{ title }}</h2>
                        <div style="width:40px;"></div>
                    </div>
                    <div style="padding:20px; font-size:14px; color:var(--text-secondary); line-height:1.6;">
                        <p>{{ content }}</p>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const path = route.path;

                const title = computed(() => {
                    if (path === '/version') return 'Version Information';
                    if (path === '/privacy') return 'Privacy Policy';
                    if (path === '/terms') return 'Terms of Service';
                    if (path === '/team') return 'About Team';
                    return 'Information';
                });

                const content = computed(() => {
                    if (path === '/version') return 'ADAJOMTK Version 2.4.0 (Stable Build). All core modules are operating locally with secure sandbox parameters.';
                    if (path === '/privacy') return 'We strictly safeguard your privacy. All computation and financial tracking happen locally on your device without unauthorized telemetry collection.';
                    if (path === '/terms') return 'By using ADAJOMTK, you agree to standard financial disclaimer protocols. All tools are provided for informational and analytical calculations only.';
                    if (path === '/team') return 'Our global engineering collective brings together experts in mobile architecture, quantitative modeling, and streamlined user interface design.';
                    return '';
                });

                function goBack() { router.go(-1); }
                return { title, content, goBack };
            }
        };

        const CheckInComponent = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="goBack">
                            <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            Back
                        </button>
                        <h2>Monthly Check-in</h2>
                        <div style="width:40px;"></div>
                    </div>
                    <div style="padding:20px; text-align:center;">
                        <p style="font-size:14px; color:var(--text-secondary); margin-bottom:20px;">Maintain your streak by checking in daily.</p>
                        <button class="btn" @click="checkIn" :disabled="checked">
                            {{ checked ? 'Checked In Today' : 'Check In Now' }}
                        </button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const checked = ref(false);
                function checkIn() {
                    checked.value = true;
                    showToast('Check-in successful!');
                }
                function goBack() { router.go(-1); }
                return { checked, checkIn, goBack };
            }
        };

        const FeedbackComponent = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="goBack">
                            <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            Back
                        </button>
                        <h2>Customer Feedback</h2>
                        <div style="width:40px;"></div>
                    </div>
                    <div style="padding:20px;">
                        <div class="input-group">
                            <label>Subject</label>
                            <input type="text" v-model="form.subject" placeholder="Feedback topic" />
                        </div>
                        <div class="input-group">
                            <label>Message</label>
                            <textarea rows="4" v-model="form.message" placeholder="Describe your issue or suggestion"></textarea>
                        </div>
                        <button class="btn" :disabled="!isValid" @click="submit">Send Feedback</button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const form = reactive({ subject: '', message: '' });
                const isValid = computed(() => form.subject.trim() && form.message.trim());

                function submit() {
                    showToast('Feedback sent successfully');
                    form.subject = '';
                    form.message = '';
                    router.go(-1);
                }

                function goBack() { router.go(-1); }
                return { form, isValid, submit, goBack };
            }
        };

        const InboxComponent = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="goBack">
                            <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            Back
                        </button>
                        <h2>Inbox</h2>
                        <div style="width:40px;"></div>
                    </div>
                    <div style="padding:16px;">
                        <div @click="openMsg" style="padding:14px; background:var(--bg-color); border-radius:var(--radius); cursor:pointer;">
                            <div style="font-weight:600; font-size:15px; margin-bottom:4px;">Welcome to ADAJOMTK</div>
                            <div style="font-size:13px; color:var(--text-secondary);">Thank you for installing our mobile application suite. Explore tools and market analytics today.</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                function openMsg() {
                    showToast('Message opened');
                }
                function goBack() { router.go(-1); }
                return { openMsg, goBack };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingComponent },
            { path: '/home', component: HomeComponent },
            { path: '/sublist', component: SubListComponent },
            { path: '/detail', component: DetailComponent },
            { path: '/toolbox', component: ToolboxComponent },
            { path: '/settings', component: SettingsComponent },
            { path: '/version', component: StaticContentComponent },
            { path: '/privacy', component: StaticContentComponent },
            { path: '/terms', component: StaticContentComponent },
            { path: '/team', component: StaticContentComponent },
            { path: '/checkin', component: CheckInComponent },
            { path: '/feedback', component: FeedbackComponent },
            { path: '/inbox', component: InboxComponent }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Main App Root
        const App = {
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    return route.path === '/home' || route.path === '/toolbox' || route.path === '/settings';
                });
                return { showTabBar, toastMessage };
            }
        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
